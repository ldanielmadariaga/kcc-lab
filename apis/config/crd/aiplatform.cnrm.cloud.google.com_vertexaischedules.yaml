    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VertexAISchedule is the Schema for the VertexAISchedule API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: VertexAIScheduleSpec defines the desired state of VertexAISchedule
            properties:
              allowQueueing:
                description: Optional. Whether new scheduled runs can be queued when
                  max_concurrent_runs limit is reached. If set to true, new runs will
                  be queued instead of skipped. Default to false.
                type: boolean
              createNotebookExecutionJobRequest:
                description: Request for [NotebookService.CreateNotebookExecutionJob][google.cloud.aiplatform.v1.NotebookService.CreateNotebookExecutionJob].
                properties:
                  notebookExecutionJob:
                    description: Required. The NotebookExecutionJob to create.
                    properties:
                      customEnvironmentSpec:
                        description: The custom compute configuration for an execution
                          job.
                        properties:
                          machineSpec:
                            description: The specification of a single machine for
                              the execution job.
                            properties:
                              acceleratorCount:
                                description: The number of accelerators to attach
                                  to the machine.
                                format: int32
                                type: integer
                              acceleratorType:
                                description: Immutable. The type of accelerator(s)
                                  that may be attached to the machine as per [accelerator_count][google.cloud.aiplatform.v1.MachineSpec.accelerator_count].
                                type: string
                              machineType:
                                description: |-
                                  Immutable. The type of the machine.

                                   See the [list of machine types supported for
                                   prediction](https://cloud.google.com/vertex-ai/docs/predictions/configure-compute#machine-types)

                                   See the [list of machine types supported for custom
                                   training](https://cloud.google.com/vertex-ai/docs/training/configure-compute#machine-types).

                                   For [DeployedModel][google.cloud.aiplatform.v1.DeployedModel] this field is
                                   optional, and the default value is `n1-standard-2`. For
                                   [BatchPredictionJob][google.cloud.aiplatform.v1.BatchPredictionJob] or as
                                   part of [WorkerPoolSpec][google.cloud.aiplatform.v1.WorkerPoolSpec] this
                                   field is required.
                                type: string
                              reservationAffinity:
                                description: Optional. Immutable. Configuration controlling
                                  how this resource pool consumes reservation.
                                properties:
                                  key:
                                    description: Optional. Corresponds to the label
                                      key of a reservation resource. To target a SPECIFIC_RESERVATION
                                      by name, use `compute.googleapis.com/reservation-name`
                                      as the key and specify the name of your reservation
                                      as its value.
                                    type: string
                                  reservationAffinityType:
                                    description: Required. Specifies the reservation
                                      affinity type.
                                    type: string
                                  values:
                                    description: Optional. Corresponds to the label
                                      values of a reservation resource. This must
                                      be the full resource name of the reservation.
                                    items:
                                      type: string
                                    type: array
                                required:
                                - reservationAffinityType
                                type: object
                              tpuTopology:
                                description: 'Immutable. The topology of the TPUs.
                                  Corresponds to the TPU topologies available from
                                  GKE. (Example: tpu_topology: "2x2x1").'
                                type: string
                            type: object
                          networkSpec:
                            description: The network configuration to use for the
                              execution job.
                            properties:
                              enableInternetAccess:
                                description: Whether to enable public internet access.
                                  Default false.
                                type: boolean
                              network:
                                description: The full name of the Google Compute Engine
                                  [network](https://cloud.google.com//compute/docs/networks-and-firewalls#networks)
                                type: string
                              subnetwork:
                                description: 'The name of the subnet that this instance
                                  is in. Format: `projects/{project_id_or_number}/regions/{region}/subnetworks/{subnetwork_id}`'
                                type: string
                            type: object
                          persistentDiskSpec:
                            description: The specification of a persistent disk to
                              attach for the execution job.
                            properties:
                              diskSizeGB:
                                description: Size in GB of the disk (default is 100GB).
                                format: int64
                                type: integer
                              diskType:
                                description: 'Type of the disk (default is "pd-standard").
                                  Valid values: "pd-ssd" (Persistent Disk Solid State
                                  Drive) "pd-standard" (Persistent Disk Hard Disk
                                  Drive) "pd-balanced" (Balanced Persistent Disk)
                                  "pd-extreme" (Extreme Persistent Disk)'
                                type: string
                            type: object
                        type: object
                      dataformRepositorySource:
                        description: The Dataform Repository pointing to a single
                          file notebook repository.
                        properties:
                          commitSha:
                            description: The commit SHA to read repository with. If
                              unset, the file will be read at HEAD.
                            type: string
                          dataformRepositoryResourceName:
                            description: 'The resource name of the Dataform Repository.
                              Format: `projects/{project_id}/locations/{location}/repositories/{repository_id}`'
                            type: string
                        type: object
                      directNotebookSource:
                        description: The contents of an input notebook file.
                        properties:
                          content:
                            description: The base64-encoded contents of the input
                              notebook file.
                            format: byte
                            type: string
                        type: object
                      displayName:
                        description: The display name of the NotebookExecutionJob.
                          The name can be up to 128 characters long and can consist
                          of any UTF-8 characters.
                        type: string
                      encryptionSpec:
                        description: Customer-managed encryption key spec for the
                          notebook execution job. This field is auto-populated if
                          the [NotebookRuntimeTemplate][google.cloud.aiplatform.v1.NotebookRuntimeTemplate]
                          has an encryption spec.
                        properties:
                          kmsKeyName:
                            description: 'Required. The Cloud KMS resource identifier
                              of the customer managed encryption key used to protect
                              a resource. Has the form: `projects/my-project/locations/my-region/keyRings/my-kr/cryptoKeys/my-key`.
                              The key needs to be in the same region as where the
                              compute resource is created.'
                            type: string
                        required:
                        - kmsKeyName
                        type: object
                      executionTimeout:
                        description: Max running time of the execution job in seconds
                          (default 86400s / 24 hrs).
                        type: string
                      executionUser:
                        description: The user email to run the execution as. Only
                          supported by Colab runtimes.
                        type: string
                      gcsNotebookSource:
                        description: 'The Cloud Storage url pointing to the ipynb
                          file. Format: `gs://bucket/notebook_file.ipynb`'
                        properties:
                          generation:
                            description: The version of the Cloud Storage object to
                              read. If unset, the current version of the object is
                              read. See https://cloud.google.com/storage/docs/metadata#generation-number.
                            type: string
                          uri:
                            description: 'The Cloud Storage uri pointing to the ipynb
                              file. Format: `gs://bucket/notebook_file.ipynb`'
                            type: string
                        type: object
                      gcsOutputURI:
                        description: 'The Cloud Storage location to upload the result
                          to. Format: `gs://bucket-name`'
                        type: string
                      kernelName:
                        description: The name of the kernel to use during notebook
                          execution. If unset, the default kernel is used.
                        type: string
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          The labels with user-defined metadata to organize NotebookExecutionJobs.

                           Label keys and values can be no longer than 64 characters
                           (Unicode codepoints), can only contain lowercase letters, numeric
                           characters, underscores and dashes. International characters are allowed.

                           See https://goo.gl/xmQnxf for more information and examples of labels.
                           System reserved label keys are prefixed with "aiplatform.googleapis.com/"
                           and are immutable.
                        type: object
                      notebookRuntimeTemplateResourceName:
                        description: The NotebookRuntimeTemplate to source compute
                          configuration from.
                        type: string
                      scheduleResourceName:
                        description: 'The Schedule resource name if this job is triggered
                          by one. Format: `projects/{project_id}/locations/{location}/schedules/{schedule_id}`'
                        type: string
                      serviceAccount:
                        description: The service account to run the execution as.
                        type: string
                      workbenchRuntime:
                        description: The Workbench runtime configuration to use for
                          the notebook execution.
                        type: object
                    type: object
                  notebookExecutionJobID:
                    description: Optional. User specified ID for the NotebookExecutionJob.
                    type: string
                  parent:
                    description: 'Required. The resource name of the Location to create
                      the NotebookExecutionJob. Format: `projects/{project}/locations/{location}`'
                    type: string
                required:
                - notebookExecutionJob
                - parent
                type: object
              createPipelineJobRequest:
                description: 'Request for [PipelineService.CreatePipelineJob][google.cloud.aiplatform.v1.PipelineService.CreatePipelineJob].
                  CreatePipelineJobRequest.parent field is required (format: projects/{project}/locations/{location}).'
                properties:
                  parent:
                    description: 'Required. The resource name of the Location to create
                      the PipelineJob in. Format: `projects/{project}/locations/{location}`'
                    type: string
                  pipelineJob:
                    description: Required. The PipelineJob to create.
                    properties:
                      displayName:
                        description: The display name of the Pipeline. The name can
                          be up to 128 characters long and can consist of any UTF-8
                          characters.
                        type: string
                      encryptionSpec:
                        description: Customer-managed encryption key spec for a pipelineJob.
                          If set, this PipelineJob and all of its sub-resources will
                          be secured by this key.
                        properties:
                          kmsKeyName:
                            description: 'Required. The Cloud KMS resource identifier
                              of the customer managed encryption key used to protect
                              a resource. Has the form: `projects/my-project/locations/my-region/keyRings/my-kr/cryptoKeys/my-key`.
                              The key needs to be in the same region as where the
                              compute resource is created.'
                            type: string
                        required:
                        - kmsKeyName
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          The labels with user-defined metadata to organize PipelineJob.

                           Label keys and values can be no longer than 64 characters
                           (Unicode codepoints), can only contain lowercase letters, numeric
                           characters, underscores and dashes. International characters are allowed.

                           See https://goo.gl/xmQnxf for more information and examples of labels.

                           Note there is some reserved label key for Vertex AI Pipelines.
                           - `vertex-ai-pipelines-run-billing-id`, user set value will get overrided.
                        type: object
                      network:
                        description: |-
                          The full name of the Compute Engine
                           [network](/compute/docs/networks-and-firewalls#networks) to which the
                           Pipeline Job's workload should be peered. For example,
                           `projects/12345/global/networks/myVPC`.
                           [Format](/compute/docs/reference/rest/v1/networks/insert)
                           is of the form `projects/{project}/global/networks/{network}`.
                           Where {project} is a project number, as in `12345`, and {network} is a
                           network name.

                           Private services access must already be configured for the network.
                           Pipeline job will apply the network configuration to the Google Cloud
                           resources being launched, if applied, such as Vertex AI
                           Training or Dataflow job. If left unspecified, the workload is not peered
                           with any network.
                        type: string
                      pipelineSpec:
                        description: The spec of the pipeline.
                        x-kubernetes-preserve-unknown-fields: true
                      preflightValidations:
                        description: Optional. Whether to do component level validations
                          before job creation.
                        type: boolean
                      pscInterfaceConfig:
                        description: Optional. Configuration for PSC-I for PipelineJob.
                        properties:
                          dnsPeeringConfigs:
                            description: Optional. DNS peering configurations. When
                              specified, Vertex AI will attempt to configure DNS peering
                              zones in the tenant project VPC to resolve the specified
                              domains using the target network's Cloud DNS. The user
                              must grant the dns.peer role to the Vertex AI Service
                              Agent on the target project.
                            items:
                              properties:
                                domain:
                                  description: Required. The DNS name suffix of the
                                    zone being peered to, e.g., "my-internal-domain.corp.".
                                    Must end with a dot.
                                  type: string
                                targetNetwork:
                                  description: Required. The VPC network name in the
                                    target_project where the DNS zone specified by
                                    'domain' is visible.
                                  type: string
                                targetProject:
                                  description: Required. The project ID hosting the
                                    Cloud DNS managed zone that contains the 'domain'.
                                    The Vertex AI Service Agent requires the dns.peer
                                    role on this project.
                                  type: string
                              required:
                              - domain
                              - targetNetwork
                              - targetProject
                              type: object
                            type: array
                          networkAttachment:
                            description: Optional. The name of the Compute Engine
                              [network attachment](https://cloud.google.com/vpc/docs/about-network-attachments)
                              to attach to the resource within the region and user
                              project. To specify this field, you must have already
                              [created a network attachment] (https://cloud.google.com/vpc/docs/create-manage-network-attachments#create-network-attachments).
                              This field is only used for resources using PSC-I.
                            type: string
                        type: object
                      reservedIPRanges:
                        description: |-
                          A list of names for the reserved ip ranges under the VPC network
                           that can be used for this Pipeline Job's workload.

                           If set, we will deploy the Pipeline Job's workload within the provided ip
                           ranges. Otherwise, the job will be deployed to any ip ranges under the
                           provided VPC network.

                           Example: ['vertex-ai-ip-range'].
                        items:
                          type: string
                        type: array
                      runtimeConfig:
                        description: Runtime config of the pipeline.
                        properties:
                          failurePolicy:
                            description: Represents the failure policy of a pipeline.
                              Currently, the default of a pipeline is that the pipeline
                              will continue to run until no more tasks can be executed,
                              also known as PIPELINE_FAILURE_POLICY_FAIL_SLOW. However,
                              if a pipeline is set to PIPELINE_FAILURE_POLICY_FAIL_FAST,
                              it will stop scheduling any new tasks when a task has
                              failed. Any scheduled tasks will continue to completion.
                            type: string
                          gcsOutputDirectory:
                            description: Required. A path in a Cloud Storage bucket,
                              which will be treated as the root output directory of
                              the pipeline. It is used by the system to generate the
                              paths of output artifacts. The artifact paths are generated
                              with a sub-path pattern `{job_id}/{task_id}/{output_key}`
                              under the specified output directory. The service account
                              specified in this pipeline must have the `storage.objects.get`
                              and `storage.objects.create` permissions for this bucket.
                            type: string
                          inputArtifacts:
                            additionalProperties:
                              properties:
                                artifactID:
                                  description: 'Artifact resource id from MLMD. Which
                                    is the last portion of an artifact resource name:
                                    `projects/{project}/locations/{location}/metadataStores/default/artifacts/{artifact_id}`.
                                    The artifact must stay within the same project,
                                    location and default metadatastore as the pipeline.'
                                  type: string
                              type: object
                            description: The runtime artifacts of the PipelineJob.
                              The key will be the input artifact name and the value
                              would be one of the InputArtifact.
                            type: object
                          parameterValues:
                            additionalProperties:
                              x-kubernetes-preserve-unknown-fields: true
                            description: The runtime parameters of the PipelineJob.
                              The parameters will be passed into [PipelineJob.pipeline_spec][google.cloud.aiplatform.v1.PipelineJob.pipeline_spec]
                              to replace the placeholders at runtime. This field is
                              used by pipelines built using `PipelineJob.pipeline_spec.schema_version`
                              2.1.0, such as pipelines built using Kubeflow Pipelines
                              SDK 1.9 or higher and the v2 DSL.
                            type: object
                          parameters:
                            additionalProperties:
                              properties:
                                boolValue:
                                  description: Represents a boolean value.
                                  type: boolean
                                nullValue:
                                  description: Represents a null value.
                                  type: string
                                numberValue:
                                  description: Represents a double value.
                                  type: number
                                stringValue:
                                  description: Represents a string value.
                                  type: string
                                structValue:
                                  description: Represents a structured value.
                                  x-kubernetes-preserve-unknown-fields: true
                              type: object
                            description: Deprecated. Use [RuntimeConfig.parameter_values][google.cloud.aiplatform.v1.PipelineJob.RuntimeConfig.parameter_values]
                              instead. The runtime parameters of the PipelineJob.
                              The parameters will be passed into [PipelineJob.pipeline_spec][google.cloud.aiplatform.v1.PipelineJob.pipeline_spec]
                              to replace the placeholders at runtime. This field is
                              used by pipelines built using `PipelineJob.pipeline_spec.schema_version`
                              2.0.0 or lower, such as pipelines built using Kubeflow
                              Pipelines SDK 1.8 or lower.
                            type: object
                        required:
                        - gcsOutputDirectory
                        type: object
                      serviceAccount:
                        description: |-
                          The service account that the pipeline workload runs as.
                           If not specified, the Compute Engine default service account in the project
                           will be used.
                           See
                           https://cloud.google.com/compute/docs/access/service-accounts#default_service_account

                           Users starting the pipeline must have the `iam.serviceAccounts.actAs`
                           permission on this service account.
                        type: string
                      templateURI:
                        description: A template uri from where the [PipelineJob.pipeline_spec][google.cloud.aiplatform.v1.PipelineJob.pipeline_spec],
                          if empty, will be downloaded. Currently, only uri from Vertex
                          Template Registry & Gallery is supported. Reference to https://cloud.google.com/vertex-ai/docs/pipelines/create-pipeline-template.
                        type: string
                    type: object
                  pipelineJobID:
                    description: |-
                      The ID to use for the PipelineJob, which will become the final component of
                       the PipelineJob name. If not provided, an ID will be automatically
                       generated.

                       This value should be less than 128 characters, and valid characters
                       are `/[a-z][0-9]-/`.
                    type: string
                required:
                - parent
                - pipelineJob
                type: object
              cron:
                description: 'Cron schedule (https://en.wikipedia.org/wiki/Cron) to
                  launch scheduled runs. To explicitly set a timezone to the cron
                  tab, apply a prefix in the cron tab: "CRON_TZ=${IANA_TIME_ZONE}"
                  or "TZ=${IANA_TIME_ZONE}". The ${IANA_TIME_ZONE} may only be a valid
                  string from IANA time zone database. For example, "CRON_TZ=America/New_York
                  1 * * * *", or "TZ=America/New_York 1 * * * *".'
                type: string
              displayName:
                description: Required. User provided name of the Schedule. The name
                  can be up to 128 characters long and can consist of any UTF-8 characters.
                type: string
              endTime:
                description: Optional. Timestamp after which no new runs can be scheduled.
                  If specified, The schedule will be completed when either end_time
                  is reached or when scheduled_run_count >= max_run_count. If not
                  specified, new runs will keep getting scheduled until this Schedule
                  is paused or deleted. Already scheduled runs will be allowed to
                  complete. Unset if not specified.
                type: string
              location:
                description: The location of this resource.
                type: string
              maxConcurrentRunCount:
                description: Required. Maximum number of runs that can be started
                  concurrently for this Schedule. This is the limit for starting the
                  scheduled requests and not the execution of the operations/jobs
                  created by the requests (if applicable).
                format: int64
                type: integer
              maxRunCount:
                description: Optional. Maximum run count of the schedule. If specified,
                  The schedule will be completed when either started_run_count >=
                  max_run_count or when end_time is reached. If not specified, new
                  runs will keep getting scheduled until this Schedule is paused or
                  deleted. Already scheduled runs will be allowed to complete. Unset
                  if not specified.
                format: int64
                type: integer
              projectRef:
                description: The project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              resourceID:
                description: The VertexAISchedule name. If not given, the metadata.name
                  will be used.
                type: string
              startTime:
                description: Optional. Timestamp after which the first run can be
                  scheduled. Default to Schedule create time if not specified.
                type: string
            required:
            - displayName
            - location
            - maxConcurrentRunCount
            - projectRef
            type: object
          status:
            description: VertexAIScheduleStatus defines the config connector machine
              state of VertexAISchedule
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the VertexAISchedule resource
                  in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  catchUp:
                    description: Output only. Whether to backfill missed runs when
                      the schedule is resumed from PAUSED state. If set to true, all
                      missed runs will be scheduled. New runs will be scheduled after
                      the backfill is complete. Default to false.
                    type: boolean
                  createNotebookExecutionJobRequest:
                    description: Request for [NotebookService.CreateNotebookExecutionJob][google.cloud.aiplatform.v1.NotebookService.CreateNotebookExecutionJob].
                    properties:
                      notebookExecutionJob:
                        description: Required. The NotebookExecutionJob to create.
                        properties:
                          createTime:
                            description: Output only. Timestamp when this NotebookExecutionJob
                              was created.
                            type: string
                          jobState:
                            description: Output only. The state of the NotebookExecutionJob.
                            type: string
                          name:
                            description: 'Output only. The resource name of this NotebookExecutionJob.
                              Format: `projects/{project_id}/locations/{location}/notebookExecutionJobs/{job_id}`'
                            type: string
                          status:
                            description: Output only. Populated when the NotebookExecutionJob
                              is completed. When there is an error during notebook
                              execution, the error details are populated.
                            properties:
                              code:
                                description: The status code, which should be an enum
                                  value of [google.rpc.Code][google.rpc.Code].
                                format: int32
                                type: integer
                              message:
                                description: A developer-facing error message, which
                                  should be in English. Any user-facing error message
                                  should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details]
                                  field, or localized by the client.
                                type: string
                            type: object
                          updateTime:
                            description: Output only. Timestamp when this NotebookExecutionJob
                              was most recently updated.
                            type: string
                        type: object
                    type: object
                  createPipelineJobRequest:
                    description: 'Request for [PipelineService.CreatePipelineJob][google.cloud.aiplatform.v1.PipelineService.CreatePipelineJob].
                      CreatePipelineJobRequest.parent field is required (format: projects/{project}/locations/{location}).'
                    properties:
                      pipelineJob:
                        description: Required. The PipelineJob to create.
                        properties:
                          createTime:
                            description: Output only. Pipeline creation time.
                            type: string
                          endTime:
                            description: Output only. Pipeline end time.
                            type: string
                          error:
                            description: Output only. The error that occurred during
                              pipeline execution. Only populated when the pipeline's
                              state is FAILED or CANCELLED.
                            properties:
                              code:
                                description: The status code, which should be an enum
                                  value of [google.rpc.Code][google.rpc.Code].
